name: Notify electricity prices

on:
  schedule:
    # GitHub cron uses UTC. These two triggers cover CET and CEST; the script
    # skips the trigger that is not 05:00 in Stockholm.
    - cron: "0 4 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PRISKLASS: ${{ secrets.PRISKLASS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send electricity prices
        run: python notify_prices.py